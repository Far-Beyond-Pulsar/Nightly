name: Nightly Build

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3

jobs:
  # ── Record upstream commit (single source of truth for all matrix jobs) ──
  resolve:
    name: Resolve commit
    runs-on: windows-latest
    outputs:
      skip: ${{ steps.commit.outputs.skip }}
      sha: ${{ steps.commit.outputs.sha }}
      short: ${{ steps.commit.outputs.short }}
      message: ${{ steps.commit.outputs.message }}
      date: ${{ steps.commit.outputs.date }}
    steps:
      - name: Fetch Pulsar-Native
        shell: bash
        run: |
          git clone --recurse-submodules --depth=1 https://github.com/Far-Beyond-Pulsar/Pulsar-Native.git code

      - name: Check for new commits since last nightly
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git -C code rev-parse HEAD)"
          SHORT="$(git -C code rev-parse --short HEAD)"
          MSG="$(git -C code log --oneline -1)"
          DATE="$(git -C code log -1 --format=%cd --date=short)"

          # Find the most recent nightly release tag and extract its short SHA
          LAST_TAG="$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo '')"
          LAST_SHORT="${LAST_TAG#nightly-}"

          if [ -n "$LAST_SHORT" ] && [ "$LAST_SHORT" = "$SHORT" ]; then
            echo "No new commits since last nightly ($SHORT). Skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "message=$MSG" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Save commit log
        shell: bash
        working-directory: code
        run: git log --oneline -30 > ../commits.txt

      - name: Upload commit log
        uses: actions/upload-artifact@v4
        with:
          name: commits
          path: commits.txt

  # ── Build matrix: all platforms in parallel ──────────────────────────────
  build:
    name: ${{ matrix.label }}
    needs: resolve
    if: ${{ needs.resolve.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_suffix: x64
            file_ext: .exe
          - label: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive_suffix: arm64
            file_ext: .exe
          - label: Linux x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_suffix: linux-x64
          - label: Linux ARM64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_suffix: linux-arm64
            cross: true
          - label: macOS ARM64
            runner: macos-latest
            target: aarch64-apple-darwin
            archive_suffix: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Fetch Pulsar-Native
        shell: bash
        run: git clone --recurse-submodules --depth=1 https://github.com/Far-Beyond-Pulsar/Pulsar-Native.git code

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libglib2.0-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxkbcommon-x11-0 libxkbcommon-x11-dev libasound2-dev \
            libfontconfig1-dev clang libclang-dev

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Configure cross for Linux ARM64
        if: matrix.cross
        working-directory: code
        run: |
          cat > Cross.toml << 'CROSSTOMLEOF'
          [target.aarch64-unknown-linux-gnu]
          pre-build = [
              "dpkg --add-architecture arm64",
              "sh -c 'grep -q \"^deb\\[arch=arm64\\]\" /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || echo \"deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs) main restricted universe multiverse\" > /etc/apt/sources.list.d/arm64-ports.list'",
              "apt-get update",
              "sh -c 'mkdir -p /etc/dpkg/dpkg.cfg.d && echo \"path-exclude /var/lib/dpkg/info/*.postinst\" > /etc/dpkg/dpkg.cfg.d/no-postinst && echo \"path-exclude /var/lib/dpkg/info/*.triggers\" >> /etc/dpkg/dpkg.cfg.d/no-postinst'",
              "apt-get install -y --no-install-recommends libfontconfig-dev:arm64 libgtk-3-dev:arm64 libasound2-dev:arm64 libwayland-dev:arm64 libxkbregistry-dev:arm64"
          ]
          CROSSTOMLEOF

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install openssl@3 protobuf
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix protobuf)/bin:$PATH" >> $GITHUB_ENV
          brew link --force protobuf

      - name: Build release (cargo)
        if: ${{ !matrix.cross }}
        working-directory: code
        shell: bash
        run: |
          if command -v nproc &>/dev/null; then
            JOBS=$(nproc)
          elif command -v sysctl &>/dev/null; then
            JOBS=$(sysctl -n hw.ncpu)
          else
            JOBS=4
          fi
          cargo build --release -j "$JOBS"

      - name: Build release (cross)
        if: matrix.cross
        working-directory: code
        shell: bash
        run: |
          if command -v nproc &>/dev/null; then
            JOBS=$(nproc)
          else
            JOBS=4
          fi
          cross build --release --target ${{ matrix.target }} -j "$JOBS"

      - name: Package
        shell: bash
        working-directory: code
        run: |
          mkdir dist

          # Determine the output directory
          if [ "${{ matrix.cross }}" = "true" ]; then
            BINDIR="target/${{ matrix.target }}/release"
          else
            BINDIR="target/release"
          fi

          # Package platform-appropriate binaries
          OS="${{ runner.os }}"
          EXT="${{ matrix.file_ext }}"
          if [ "$OS" = "Windows" ]; then
            find "$BINDIR" -maxdepth 1 -type f \
              \( -name "*${EXT}" -o -name '*.dll' -o -name '*.pdb' \) \
              -exec cp {} dist/ \;
          elif [ "$OS" = "Linux" ]; then
            find "$BINDIR" -maxdepth 1 -type f \( -perm /111 -o -name '*.so*' \) \
              -exec cp {} dist/ \;
          elif [ "$OS" = "macOS" ]; then
            find "$BINDIR" -maxdepth 1 -type f \( -perm +111 -o -name '*.dylib' \) \
              -exec cp {} dist/ \;
          fi

          cd dist
          7z a -tzip "../Pulsar-Native_${{ matrix.archive_suffix }}_${{ needs.resolve.outputs.short }}.zip" ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.archive_suffix }}
          path: code/Pulsar-Native_${{ matrix.archive_suffix }}_${{ needs.resolve.outputs.short }}.zip

  # ── Collect, commit, and release (runs after ALL matrix jobs finish) ────
  publish:
    name: Publish nightly
    runs-on: ubuntu-latest
    needs: [resolve, build]
    if: ${{ always() && needs.resolve.outputs.skip != 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    steps:
      - name: Checkout Nightly repo
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Gather zips and commit log
        shell: bash
        run: |
          find _artifacts -name '*.zip' -exec cp {} . \;
          if [ -f _artifacts/commits/commits.txt ]; then
            cp _artifacts/commits/commits.txt ./
          fi
          rm -rf _artifacts

      - name: Fetch Pulsar-Native source into code/ (flat, no submodule links)
        shell: bash
        run: |
          git clone --recurse-submodules --depth=1 https://github.com/Far-Beyond-Pulsar/Pulsar-Native.git code
          rm -rf code/.git code/.gitmodules
          find code -name '.git' -delete 2>/dev/null || true
          find code -name '.gitignore' -delete 2>/dev/null || true

      - name: Write README
        shell: bash
        run: |
          cat > README.md << README_EOF
          # ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️
          #    ⚠️  THIS IS A NIGHTLY BUILD REPOSITORY  ⚠️
          #    ⚠️  DO NOT USE FOR PRODUCTION            ⚠️
          # ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️

          Automated **nightly builds** of [Pulsar-Native](https://github.com/Far-Beyond-Pulsar/Pulsar-Native).

          | Field | Value |
          |---|---|
          | Source commit | [${{ needs.resolve.outputs.sha }}](https://github.com/Far-Beyond-Pulsar/Pulsar-Native/commit/${{ needs.resolve.outputs.sha }}) |
          | Date | ${{ needs.resolve.outputs.date }} |
          | Message | \`${{ needs.resolve.outputs.message }}\` |
          | Workflow | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ## 📦 Downloads

          Browse the [Releases page](https://github.com/Far-Beyond-Pulsar/Nightly/releases) for archives.

          | Platform | Archive |
          |---|---|
          | Windows x64 | \`Pulsar-Native_x64_${{ needs.resolve.outputs.short }}.zip\` |
          | Windows ARM64 | \`Pulsar-Native_arm64_${{ needs.resolve.outputs.short }}.zip\` |
          | Linux x64 | \`Pulsar-Native_linux-x64_${{ needs.resolve.outputs.short }}.zip\` |
          | Linux ARM64 | \`Pulsar-Native_linux-arm64_${{ needs.resolve.outputs.short }}.zip\` |
          | macOS ARM64 | \`Pulsar-Native_macos-arm64_${{ needs.resolve.outputs.short }}.zip\` |

          > [!CAUTION]
          > These are **automated nightly builds** — they are **not** tested, validated, or
          > guaranteed to work in any capacity. Use at your own risk.
          >
          > Nightly builds may:
          > - Corrupt data (save files, project assets, configuration)
          > - Crash unexpectedly or fail to launch entirely
          > - Fail to compile on certain configurations
          > - Crash GPU drivers or cause display driver timeouts
          > - Introduce regressions that were not present in the previous build
          >
          > If stability is important to you, use the
          > [official releases](https://github.com/Far-Beyond-Pulsar/Pulsar-Native/releases)
          > instead.

          ## ℹ️ About

          [**Pulsar-Native**](https://github.com/Far-Beyond-Pulsar/Pulsar-Native) is a next-generation Rust
          game engine where the editor is the runtime and the runtime is the editor.

          This repository distributes **automated binaries** of the latest \`main\` branch
          for evaluation and testing. No source changes are made here — everything in
          [\`code/\`](./code) is a direct mirror of
          [Pulsar-Native](https://github.com/Far-Beyond-Pulsar/Pulsar-Native).
          README_EOF

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "Nightly Build Bot"
          git config user.email "bot@far-beyond-pulsar.github.com"
          git add -A
          git commit -m "Nightly ${{ needs.resolve.outputs.short }} — ${{ needs.resolve.outputs.message }}"
          git push origin main

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nightly-${{ needs.resolve.outputs.short }}"
          git tag -f "$TAG" HEAD
          git push origin "$TAG" --force

          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true

          LOG=$(cat commits.txt 2>/dev/null | sed 's/^/- /' || git -C code log --oneline -30 2>/dev/null | sed 's/^/- /')

          NOTES=$(cat << NOTESEOF
          > [!CAUTION]
          > These are **automated nightly builds** — they are **not** tested, validated, or
          > guaranteed to work in any capacity. Use at your own risk.
          >
          > Nightly builds may:
          > - Corrupt data (save files, project assets, configuration)
          > - Crash unexpectedly or fail to launch entirely
          > - Fail to compile on certain configurations
          > - Crash GPU drivers or cause display driver timeouts
          > - Introduce regressions that were not present in the previous build
          >
          > If stability is important to you, use the
          > [official releases](https://github.com/Far-Beyond-Pulsar/Pulsar-Native/releases)
          > instead.

          **Build of** [Pulsar-Native@${{ needs.resolve.outputs.sha }}](https://github.com/Far-Beyond-Pulsar/Pulsar-Native/commit/${{ needs.resolve.outputs.sha }}) — ${{ needs.resolve.outputs.date }}

          <details>
          <summary><b>Recent commits (up to 30)</b></summary>

          $LOG

          </details>
          NOTESEOF
          )

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Nightly ${{ needs.resolve.outputs.short }}" \
            --notes "$NOTES" \
            --prerelease \
            Pulsar-Native_x64_${{ needs.resolve.outputs.short }}.zip \
            Pulsar-Native_arm64_${{ needs.resolve.outputs.short }}.zip \
            Pulsar-Native_linux-x64_${{ needs.resolve.outputs.short }}.zip \
            Pulsar-Native_linux-arm64_${{ needs.resolve.outputs.short }}.zip \
            Pulsar-Native_macos-arm64_${{ needs.resolve.outputs.short }}.zip
